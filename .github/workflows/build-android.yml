name: Build VELOCITY RUSH 3D Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  build-android:
    name: Import, validate and export APK
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: "4.4.1"
      GODOT_RELEASE: "4.4.1-stable"
      PRESET_NAME: "Android"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.1"

      - name: Download Godot editor and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot/godot.zip"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            --output "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          chmod +x "$RUNNER_TEMP/godot/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Create debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure Godot editor settings
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          mkdir -p "$HOME/.config/godot"
          for f in editor_settings-4.4.tres editor_settings-4.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/android_sdk_path = \"$SDK_DIR\""
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
              echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > "$HOME/.config/godot/$f"
          done
          echo "Android SDK: $SDK_DIR"
          echo "Java SDK: $JAVA_HOME"

      - name: Fix Android export preset (Min SDK / Target SDK error)
        shell: bash
        run: |
          set -euo pipefail
          CFG="export_presets.cfg"
          if [ ! -f "$CFG" ]; then
            echo "ERROR: export_presets.cfg not found in repository root."
            echo "Make sure it is committed (not listed in .gitignore)."
            exit 1
          fi
          if ! grep -q "name=\"${PRESET_NAME}\"" "$CFG"; then
            echo "ERROR: no export preset named \"${PRESET_NAME}\" in $CFG"
            grep -n '^name=' "$CFG" || true
            exit 1
          fi
          # Without Gradle build, Godot refuses any custom Min/Target SDK.
          # Disable Gradle and clear both values so the template defaults are used.
          sed -i -E 's|^gradle_build/use_gradle_build=.*|gradle_build/use_gradle_build=false|' "$CFG"
          sed -i -E 's|^gradle_build/min_sdk=.*|gradle_build/min_sdk=""|' "$CFG"
          sed -i -E 's|^gradle_build/target_sdk=.*|gradle_build/target_sdk=""|' "$CFG"
          echo "--- gradle_build settings now ---"
          grep -n '^gradle_build/' "$CFG" || echo "(no gradle_build keys, defaults will be used)"

      - name: Verify project files and local audio
        shell: bash
        run: |
          if [ -f tools/validate_project.py ]; then
            python3 tools/validate_project.py
          else
            echo "tools/validate_project.py not found, skipping validation."
          fi

      - name: Import Godot resources
        shell: bash
        run: |
          set -uo pipefail
          # Godot can return a non-zero code on quit in headless mode even when import worked.
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --import || true
          test -d "$GITHUB_WORKSPACE/.godot" || { echo "ERROR: import did not create .godot folder"; exit 1; }

      - name: Export debug APK
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --export-debug "${PRESET_NAME}" build/VelocityRush3D.apk 2>&1 | tee build/export.log
          if grep -q "configuration errors" build/export.log; then
            echo "ERROR: Godot reported export configuration errors (see log above)."
            exit 1
          fi
          test -s build/VelocityRush3D.apk
          ls -lh build/VelocityRush3D.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Rush-3D-Android-APK
          path: build/VelocityRush3D.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload export log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: build/export.log
          if-no-files-found: ignore
          retention-days: 7
