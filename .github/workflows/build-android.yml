name: Build Velocity Rush 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: velocity-rush-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      GODOT_VERSION: "4.4.1"
      PRESET_NAME: "Android"
      APK_PATH: "build/VelocityRush3D.apk"

    steps:
      # ==========================================
      # 1. Download project
      # ==========================================
      - name: Checkout project
        uses: actions/checkout@v4

      # ==========================================
      # 2. Install Java 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 3. FIX ANDROID SDK INSTALLATION
      # ==========================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          packages: "platform-tools"
          accept-android-sdk-licenses: "yes"
          log-accepted-android-sdk-licenses: "false"

      # ==========================================
      # 4. Install required Android packages
      # ==========================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========== ANDROID SDK =========="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

          echo "========== SDK MANAGER =========="

          command -v sdkmanager

          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "========== VERIFY SDK =========="

          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"

          java -version
          adb version

          echo "Android SDK installation completed."

      # ==========================================
      # 5. Download Godot 4.4.1
      # ==========================================
      - name: Download Godot Engine
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p godot-bin

          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"

          curl -fL --retry 3 \
            "$GODOT_URL" \
            -o godot-bin/godot.zip

          unzip -o godot-bin/godot.zip -d godot-bin

          GODOT_BIN="./godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

          if [ ! -f "$GODOT_BIN" ]; then
            echo "::error::Godot executable not found."
            find godot-bin -maxdepth 3 -type f
            exit 1
          fi

          chmod +x "$GODOT_BIN"

          "$GODOT_BIN" --version

      # ==========================================
      # 6. Install matching export templates
      # ==========================================
      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          mkdir -p godot-bin/templates

          curl -fL --retry 3 \
            "$TEMPLATE_URL" \
            -o godot-bin/templates/export_templates.tpz

          unzip -o \
            godot-bin/templates/export_templates.tpz \
            -d godot-bin/templates/extracted

          SOURCE_DIR="godot-bin/templates/extracted/templates"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "::error::Export templates not found."
            find godot-bin/templates -maxdepth 4 -type f
            exit 1
          fi

          mkdir -p "$TEMPLATE_DIR"

          cp -a "$SOURCE_DIR/." "$TEMPLATE_DIR/"

          echo "Godot export templates installed:"
          ls -la "$TEMPLATE_DIR"

      # ==========================================
      # 7. Verify project files
      # ==========================================
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f project.godot ]; then
            echo "::error::project.godot not found."
            exit 1
          fi

          if [ ! -f export_presets.cfg ]; then
            echo "::error::export_presets.cfg not found."
            exit 1
          fi

          echo "========== PROJECT ROOT =========="
          ls -la

          echo "========== EXPORT PRESET =========="
          cat export_presets.cfg

      # ==========================================
      # 8. Repair Android export preset
      # ==========================================
      - name: Repair Android export preset
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("export_presets.cfg")
          text = path.read_text(encoding="utf-8")

          sections = re.split(r'(?=^\[)', text, flags=re.M)

          found = False
          output = []

          for section in sections:
              lines = section.splitlines()

              if lines and lines[0].strip() == "[preset.0]":
                  found = True

                  section = re.sub(
                      r'(?m)^gradle_build/min_sdk=.*(?:\n|$)',
                      '',
                      section
                  )

                  section = re.sub(
                      r'(?m)^gradle_build/target_sdk=.*(?:\n|$)',
                      '',
                      section
                  )

                  section = re.sub(
                      r'(?m)^gradle_build/use_gradle_build=.*$',
                      'gradle_build/use_gradle_build=false',
                      section
                  )

              output.append(section)

          if not found:
              raise SystemExit(
                  "ERROR: Android preset [preset.0] not found."
              )

          path.write_text(
              ''.join(output),
              encoding="utf-8"
          )

          print("Android export preset repaired.")
          PY

          echo "========== UPDATED CFG =========="
          cat export_presets.cfg

      # ==========================================
      # 9. Validate launcher icon
      # ==========================================
      - name: Validate Android launcher icon
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          cfg = Path("export_presets.cfg")
          text = cfg.read_text(encoding="utf-8")

          icon = Path("icon.png")

          if icon.is_file():
              print("Project icon found.")
              print("Size:", icon.stat().st_size, "bytes")
          else:
              print("WARNING: icon.png not found in project root.")
              print("Clearing explicit launcher icon override.")

              text = re.sub(
                  r'(?m)^launcher_icons/main_192x192=.*$',
                  'launcher_icons/main_192x192=""',
                  text
              )

              cfg.write_text(text, encoding="utf-8")

          print("Icon validation completed.")
          PY

      # ==========================================
      # 10. Configure Godot SDK paths
      # ==========================================
      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          cp \
            "$HOME/.config/godot/editor_settings-4.4.tres" \
            "$HOME/.config/godot/editor_settings-4.tres"

          echo "Godot SDK paths configured."

      # ==========================================
      # 11. Create Android debug keystore
      # ==========================================
      - name: Prepare Android build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          KEYSTORE="$RUNNER_TEMP/velocity-debug.keystore"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -s "$KEYSTORE"

          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

          echo "Android debug keystore configured."

      # ==========================================
      # 12. Import project resources
      # ==========================================
      - name: Import Godot project
        shell: bash
        run: |
          set -uo pipefail

          GODOT_BIN="./godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --verbose \
            --quit \
            2>&1 | tee build/import.log

          RESULT=${PIPESTATUS[0]}

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Godot import failed."
            exit "$RESULT"
          fi

      # ==========================================
      # 13. Export APK
      # ==========================================
      - name: Export debug APK
        shell: bash
        run: |
          set -Eeuo pipefail

          GODOT_BIN="./godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          LOG_PATH="build/export.log"

          mkdir -p build
          rm -f "$APK_PATH" "$LOG_PATH"

          echo "========== GODOT VERSION =========="
          "$GODOT_BIN" --version

          echo "========== ANDROID SDK =========="
          echo "$ANDROID_HOME"

          echo "========== JAVA =========="
          echo "$JAVA_HOME"

          echo "========== SIGNING =========="
          test -s "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH"

          echo "========== EXPORT PRESET =========="
          cat export_presets.cfg

          echo "========== EXPORTING APK =========="

          set +e

          "$GODOT_BIN" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --verbose \
            --export-debug "$PRESET_NAME" "$APK_PATH" \
            2>&1 | tee "$LOG_PATH"

          RESULT=${PIPESTATUS[0]}

          set -e

          echo "========== EXPORT ERROR DETAILS =========="

          grep -ni -B 8 -A 12 -E \
            'configuration errors|ERROR:|keystore|icon|template|Android SDK|Java SDK|failed|invalid|missing|required' \
            "$LOG_PATH" || true

          if [ "$RESULT" -ne 0 ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::APK export failed."
            exit 1
          fi

          echo "APK created successfully."
          ls -lh "$APK_PATH"

      # =========================================
