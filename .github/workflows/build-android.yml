name: Build VELOCITY RUSH 3D Android APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: velocity-rush-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      GODOT_VERSION: "4.4.1"
      GODOT_RELEASE: "4.4.1-stable"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"
          packages: "platform-tools"

      - name: Configure Java and Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$JAVA_HOME/bin:$PATH"

          java -version

          if ! java -version 2>&1 | grep -Eq 'version "17\.|openjdk 17\.'; then
            echo "::error::Java 17 is required."
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"

          mkdir -p "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmdline-tools;latest"

          echo "Android SDK configured."

      - name: Download Godot and Android export templates
        shell: bash
        run: |
          set -Eeuo pipefail

          DOWNLOAD_DIR="$RUNNER_TEMP/godot"
          mkdir -p "$DOWNLOAD_DIR/bin" "$DOWNLOAD_DIR/templates"

          curl --fail --show-error --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$DOWNLOAD_DIR/godot.zip"

          curl --fail --show-error --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            --output "$DOWNLOAD_DIR/templates.tpz"

          unzip -q "$DOWNLOAD_DIR/godot.zip" -d "$DOWNLOAD_DIR/bin"

          unzip -q "$DOWNLOAD_DIR/templates.tpz" \
            -d "$DOWNLOAD_DIR/templates"

          GODOT_BIN="$DOWNLOAD_DIR/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

          if [[ ! -f "$GODOT_BIN" ]]; then
            echo "::error::Godot executable was not found."
            find "$DOWNLOAD_DIR/bin" -maxdepth 3 -type f
            exit 1
          fi

          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"

          if [[ -d "$DOWNLOAD_DIR/templates/templates" ]]; then
            cp -a "$DOWNLOAD_DIR/templates/templates/." "$TEMPLATE_DIR/"
          else
            cp -a "$DOWNLOAD_DIR/templates/." "$TEMPLATE_DIR/"
          fi

          if [[ ! -f "$TEMPLATE_DIR/android_debug.apk" ]]; then
            echo "::error::Android debug export template is missing."
            find "$TEMPLATE_DIR" -maxdepth 2 -type f
            exit 1
          fi

          "$GODOT_BIN" --version

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF_SETTINGS

      - name: Configure Android debug signing
        shell: bash
        run: |
          set -Eeuo pipefail

          KEYSTORE="$HOME/.android/debug.keystore"

          mkdir -p "$HOME/.android"

          if [[ ! -f "$KEYSTORE" ]]; then
            "$JAVA_HOME/bin/keytool" -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

          test -s "$KEYSTORE"

          echo "Android debug signing configured."

      - name: Validate project files
        shell: bash
        run: |
          set -Eeuo pipefail

          for FILE in \
            project.godot \
            export_presets.cfg \
            .github/workflows/build-android.yml \
            tools/validate_project.py
          do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Required file is missing: $FILE"
              exit 1
            fi
          done

          if ! grep -Eq 'name[[:space:]]*=[[:space:]]*"Android"' export_presets.cfg; then
            echo "::error::Export preset named Android was not found."
            exit 1
          fi

          python3 tools/validate_project.py

      - name: Import Godot resources
        shell: bash
        run: |
          set -Eeuo pipefail

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --import \
            --quit

      - name: Check Godot project
        shell: bash
        run: |
          set -Eeuo pipefail

          set +e

          "$GODOT_BIN" \
            --headless \
            --editor \
            --verbose \
            --path "$GITHUB_WORKSPACE" \
            --quit \
            2>&1 | tee "$RUNNER_TEMP/godot-check.log"

          CHECK_STATUS=${PIPESTATUS[0]}

          set -e

          if [[ "$CHECK_STATUS" -ne 0 ]]; then
            echo "::error::Godot project check failed."
            exit "$CHECK_STATUS"
          fi

      - name: Check Android SDK tools
        shell: bash
        run: |
          set -Eeuo pipefail

          test -x "$ANDROID_HOME/platform-tools/adb"

          if [[ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]]; then
            echo "::error::Android build-tools 34.0.0 are missing."
            exit 1
          fi

          if [[ ! -x "$ANDROID_HOME/build-tools/34.0.0/apksigner" ]]; then
            echo "::error::apksigner was not found."
            exit 1
          fi

          echo "Android SDK tools are ready."

      - name: Export Android debug APK
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p build

          APK_PATH="$GITHUB_WORKSPACE/build/VelocityRush3D.apk"
          EXPORT_LOG="$RUNNER_TEMP/godot-export.log"

          echo "Godot version:"
          "$GODOT_BIN" --version

          echo "Android SDK: $ANDROID_HOME"
          echo "Java SDK: $JAVA_HOME"
          echo "Checking export preset..."

if [[ ! -f export_presets.cfg ]]; then
  echo "::error::export_presets.cfg not found."
  exit 1
fi

if ! grep -Fq 'name="Android"' export_presets.cfg; then
  echo "::error::Android export preset was not found."
  cat export_presets.cfg
  exit 1
fi

echo "Export preset found."

          echo "Starting Android APK export..."

          set +e

          "$GODOT_BIN" \
            --headless \
            --verbose \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" "$APK_PATH" \
            2>&1 | tee "$EXPORT_LOG"

          EXPORT_STATUS=${PIPESTATUS[0]}

          set -e

          if [[ "$EXPORT_STATUS" -ne 0 ]]; then
            echo "::error::Godot Android export failed."
            echo "Relevant error messages:"

            grep -niE \
              'error:|cannot export|configuration errors|failed|missing|keystore|sdk|icon|template' \
              "$EXPORT_LOG" || true

            exit "$EXPORT_STATUS"
          fi

          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::APK was not created or is empty."
            exit 1
          fi

          echo "APK export succeeded."
          ls -lh "$APK_PATH"

      - name: Verify APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK_PATH="$GITHUB_WORKSPACE/build/VelocityRush3D.apk"

          test -s "$APK_PATH"

          "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            dump badging "$APK_PATH" || true

          echo "APK verification completed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Rush-3D-Android-APK
          path: build/VelocityRush3D.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload export diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Rush-3D-Build-Diagnostics
          path: |
            ${{ runner.temp }}/godot-export.log
            ${{ runner.temp }}/godot-check.log
          if-no-files-found: ignore
          retention-days: 7
