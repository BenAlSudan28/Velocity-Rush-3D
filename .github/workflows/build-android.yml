name: Build VELOCITY RUSH 3D Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: velocity-rush-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Validate and Export Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      GODOT_VERSION: "4.4.1"
      GODOT_RELEASE: "4.4.1-stable"
      PRESET_NAME: "Android"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"
          packages: "platform-tools"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          java -version

          if ! java -version 2>&1 | grep -Eq 'version "17\.|openjdk 17\.'; then
            echo "::error::Java 17 is required."
            exit 1
          fi

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [[ ! -d "$SDK_DIR" ]]; then
            echo "::error::Android SDK directory not found: $SDK_DIR"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          "$SDKMANAGER" --sdk_root="$SDK_DIR" --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.1"

          test -x "$SDK_DIR/platform-tools/adb"

          echo "Android SDK configured successfully."

      - name: Download Godot and export templates
        shell: bash
        run: |
          set -Eeuo pipefail

          DOWNLOAD_DIR="$RUNNER_TEMP/godot"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$DOWNLOAD_DIR/bin"
          mkdir -p "$DOWNLOAD_DIR/templates"
          mkdir -p "$TEMPLATE_DIR"

          curl --fail --show-error --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$DOWNLOAD_DIR/godot.zip"

          curl --fail --show-error --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            --output "$DOWNLOAD_DIR/templates.tpz"

          unzip -q "$DOWNLOAD_DIR/godot.zip" \
            -d "$DOWNLOAD_DIR/bin"

          unzip -q "$DOWNLOAD_DIR/templates.tpz" \
            -d "$DOWNLOAD_DIR/templates"

          GODOT_BIN="$DOWNLOAD_DIR/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

          if [[ ! -f "$GODOT_BIN" ]]; then
            echo "::error::Godot executable was not found."
            find "$DOWNLOAD_DIR/bin" -maxdepth 3 -type f
            exit 1
          fi

          chmod +x "$GODOT_BIN"

          if [[ -d "$DOWNLOAD_DIR/templates/templates" ]]; then
            cp -a "$DOWNLOAD_DIR/templates/templates/." "$TEMPLATE_DIR/"
          else
            cp -a "$DOWNLOAD_DIR/templates/." "$TEMPLATE_DIR/"
          fi

          if [[ ! -f "$TEMPLATE_DIR/android_debug.apk" ]]; then
            echo "::error::Android debug template is missing."
            find "$TEMPLATE_DIR" -maxdepth 2 -type f
            exit 1
          fi

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      - name: Configure Godot Android paths
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

          echo "Android SDK: $ANDROID_HOME"
          echo "Java SDK: $JAVA_HOME"

      - name: Create debug keystore
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$HOME/.android"

          KEYSTORE="$HOME/.android/debug.keystore"

          if [[ ! -f "$KEYSTORE" ]]; then
            "$JAVA_HOME/bin/keytool" -genkeypair \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

          test -s "$KEYSTORE"

          echo "Debug keystore is ready."

      - name: Validate project files
        shell: bash
        run: |
          set -Eeuo pipefail

          for FILE in \
            project.godot \
            export_presets.cfg \
            tools/validate_project.py
          do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Required file is missing: $FILE"
              exit 1
            fi
          done

          if ! grep -Fq 'name="Android"' export_presets.cfg; then
            echo "::error::Android export preset was not found."
            cat export_presets.cfg
            exit 1
          fi

          echo "Project files are present."

          python3 tools/validate_project.py

      - name: Repair Android export preset
        shell: bash
        run: |
          set -Eeuo pipefail

          CFG="export_presets.cfg"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("export_presets.cfg")

          if not path.is_file():
              print("ERROR: export_presets.cfg was not found.")
              sys.exit(1)

          text = path.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)

          output = []
          in_android_options = False
          found_android = False

          for line in lines:
              stripped = line.strip()

              if stripped == '[preset.0]':
                  found_android = True

              if stripped == '[preset.0.options]':
                  in_android_options = True
              elif stripped.startswith('[preset.') and stripped != '[preset.0.options]':
                  in_android_options = False

              if in_android_options:
                  if re.match(r'^\s*gradle_build/min_sdk\s*=', line):
                      print("Removed gradle_build/min_sdk override.")
                      continue

                  if re.match(r'^\s*gradle_build/target_sdk\s*=', line):
                      print("Removed gradle_build/target_sdk override.")
                      continue

                  if re.match(r'^\s*gradle_build/use_gradle_build\s*=', line):
                      output.append('gradle_build/use_gradle_build=false\n')
                      continue

              output.append(line)

          if not found_android:
              print("ERROR: [preset.0] was not found.")
              sys.exit(1)

          result = ''.join(output)

          if 'name="Android"' not in result:
              print("ERROR: Android preset name was not found.")
              sys.exit(1)

          path.write_text(result, encoding="utf-8")

          print("Android preset repaired.")
          PY

          echo "Checking remaining Gradle settings:"

          grep -n 'gradle_build/' "$CFG" || true

          if grep -Eq '^[[:space:]]*gradle_build/(min_sdk|target_sdk)=' "$CFG"; then
            echo "::error::Min SDK or Target SDK override still exists."
            exit 1
          fi

          echo "Android SDK override conflicts removed."

      - name: Check Android icon
        shell: bash
        run: |
          set -Eeuo pipefail

          if grep -Fq 'launcher_icons/main_192x192="res://icon.png"' export_presets.cfg; then
            if [[ ! -f "$GITHUB_WORKSPACE/icon.png" ]]; then
              echo "::error::export_presets.cfg references res://icon.png, but icon.png is missing from the project root."
              exit 1
            fi
          fi

          echo "Icon path check completed."

      - name: Import Godot resources
        shell: bash
        run: |
          set -Eeuo pipefail

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --import \
            --quit

          echo "Godot resource import completed."

      - name: Check Godot project
        shell: bash
        run: |
          set -Eeuo pipefail

          LOG="$RUNNER_TEMP/godot-project-check.log"

          set +e

          "$GODOT_BIN" \
            --headless \
            --editor \
            --verbose \
            --path "$GITHUB_WORKSPACE" \
            --quit \
            2>&1 | tee "$LOG"

          STATUS=${PIPESTATUS[0]}

          set -e

          if [[ "$STATUS" -ne 0 ]]; then
            echo "::error::Godot project check failed."
            exit "$STATUS"
          fi

      - name: Export Android debug APK
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build"

          APK_PATH="$GITHUB_WORKSPACE/build/VelocityRush3D.apk"
          LOG="$GITHUB_WORKSPACE/build/export.log"

          echo "Godot version:"
          "$GODOT_BIN" --version

          echo "Android SDK: $ANDROID_HOME"
          echo "Java SDK: $JAVA_HOME"

          echo "Checking Android export preset..."

          if ! grep -Fq 'name="Android"' export_presets.cfg; then
            echo "::error::Android export preset is missing."
            exit 1
          fi

          if grep -Eq '^[[:space:]]*gradle_build/(min_sdk|target_sdk)=' export_presets.cfg; then
            echo "::error::Remove Min SDK and Target SDK overrides when Gradle build is disabled."
            exit 1
          fi

          echo "Preset found. Starting Godot export..."

          set +e

          "$GODOT_BIN" \
            --headless \
            --verbose \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "$PRESET_NAME" "$APK_PATH" \
            2>&1 | tee "$LOG"

          EXPORT_STATUS=${PIPESTATUS[0]}

          set -e

          if [[ "$EXPORT_STATUS" -ne 0 ]] || [[ ! -s "$APK_PATH" ]]; then
            echo "::error::Android APK export failed."

            echo "Relevant error messages:"

            grep -niE \
              'error|configuration|failed|missing|invalid|keystore|sdk|icon|template|warning' \
              "$LOG" || true

            exit 1
          fi

          echo "APK export completed successfully."
          ls -lh "$APK_PATH"

      - name: Verify APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK_PATH="$GITHUB_WORKSPACE/build/VelocityRush3D.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.1/apksigner"

          if [[ ! -x "$APKSIGNER" ]]; then
            APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          fi

          test -s "$APK_PATH"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify "$APK_PATH"

          echo "APK signature verified."

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Rush-3D-Android-APK
          path: build/VelocityRush3D.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Rush-3D-Build-Diagnostics
          path: |
            build/export.log
            ${{ runner.temp }}/godot-project-check.log
          if-no-files-found: ignore
          retention-days: 7
