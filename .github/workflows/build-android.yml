name: Build VELOCITY RUSH 3D Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  build-android:
    name: Import, validate and export APK
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: "4.4.1"
      GODOT_RELEASE: "4.4.1-stable"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1"

      - name: Download Godot editor and matching export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/templates"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot/godot.zip"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            --output "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          chmod +x "$RUNNER_TEMP/godot/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          echo "$RUNNER_TEMP/godot/bin" >> "$GITHUB_PATH"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF_SETTINGS

      - name: Verify project files and local audio
        run: python3 tools/validate_project.py

      - name: Import Godot resources and parse scripts
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --import --quit
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --export-debug "Android" build/VelocityRush3D.apk
          test -s build/VelocityRush3D.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Rush-3D-Android-APK
          path: build/VelocityRush3D.apk
          if-no-files-found: error
          retention-days: 14
