name: Build VELOCITY RUSH 3D Android APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: velocity-rush-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Validate and export Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      GODOT_VERSION: "4.4.1"
      GODOT_RELEASE: "4.4.1-stable"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verify Java 17 and install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          export PATH="$JAVA_HOME/bin:$PATH"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"

          echo "Checking Java version..."
          java -version 2>&1

          if ! java -version 2>&1 | grep -Eq 'version "17\.|openjdk 17\.'; then
            echo "::error::Java 17 is required."
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          mkdir -p "$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Download Godot 4.4.1 and export templates
        shell: bash
        run: |
          set -Eeuo pipefail

          WORK_DIR="$RUNNER_TEMP/godot-download"
          mkdir -p "$WORK_DIR/bin" "$WORK_DIR/templates"

          curl --fail --show-error --location \
            --retry 3 --retry-all-errors \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$WORK_DIR/godot.zip"

          curl --fail --show-error --location \
            --retry 3 --retry-all-errors \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            --output "$WORK_DIR/templates.tpz"

          unzip -q "$WORK_DIR/godot.zip" -d "$WORK_DIR/bin"
          unzip -q "$WORK_DIR/templates.tpz" -d "$WORK_DIR/templates"

          GODOT_BIN="$WORK_DIR/bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"

          if [[ ! -f "$GODOT_BIN" ]]; then
            echo "::error::Godot executable was not found."
            find "$WORK_DIR/bin" -maxdepth 3 -type f -print
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"

          if [[ -d "$WORK_DIR/templates/templates" ]]; then
            cp -a "$WORK_DIR/templates/templates/." "$TEMPLATE_DIR/"
          else
            cp -a "$WORK_DIR/templates/." "$TEMPLATE_DIR/"
          fi

          if [[ ! -f "$TEMPLATE_DIR/android_debug.apk" ]]; then
            echo "::error::Godot Android debug export template is missing."
            find "$TEMPLATE_DIR" -maxdepth 2 -type f -print
            exit 1
          fi

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF_SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF_SETTINGS

      - name: Validate project files
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f project.godot || {
            echo "::error::project.godot was not found in the repository root."
            exit 1
          }

          test -f export_presets.cfg || {
            echo "::error::export_presets.cfg was not found."
            exit 1
          }

          test -f tools/validate_project.py || {
            echo "::error::tools/validate_project.py was not found."
            exit 1
          }

          if ! grep -Fq 'name="Android"' export_presets.cfg; then
            echo "::error::An Android export preset named Android is required."
            exit 1
          fi

          echo "Android export preset found."

          python3 tools/validate_project.py

      - name: Import resources and check Godot project
        shell: bash
        run: |
          set -Eeuo pipefail

          "$GODOT_BIN" --version

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --import \
            --quit

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE" \
            --quit

      - name: Export Android debug APK
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p build

          "$GODOT_BIN" \
            --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/VelocityRush3D.apk"

          if [[ ! -s "$GITHUB_WORKSPACE/build/VelocityRush3D.apk" ]]; then
            echo "::error::Godot did not create a valid APK file."
            exit 1
          fi

          echo "APK export completed."

      - name: Verify APK
        shell: bash
        run: |
          set -Eeuo pipefail

          APK="$GITHUB_WORKSPACE/build/VelocityRush3D.apk"

          test -s "$APK"

          echo "APK file information:"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Rush-3D-Android-APK
          path: build/VelocityRush3D.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Rush-3D-Build-Logs
          path: |
            .godot/
            build/
          if-no-files-found: ignore
          retention-days: 7
